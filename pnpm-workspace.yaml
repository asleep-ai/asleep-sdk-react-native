packages:
  - "example"

# Security and compatibility pins applied to the dev tree.
# Library publish artifacts are unaffected (devDependencies only).
overrides:
  "@babel/plugin-transform-modules-systemjs@<7.29.4": ">=7.29.4"
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  "@xmldom/xmldom@<0.8.13": ">=0.8.13"
  # Caret, not >=: an open range resolves to the newest major (5.x), which is
  # ESM-only and breaks minimatch v3's `require('brace-expansion')`.
  "brace-expansion@<1.1.13": "^1.1.13"
  "brace-expansion@^5.0.0": "^5.0.6"
  "flatted@<=3.4.1": ">=3.4.2"
  "handlebars@<=4.7.8": ">=4.7.9"
  "lodash@<=4.17.23": ">=4.18.0"
  "lodash-es@<=4.17.23": ">=4.18.0"
  "node-forge@<=1.3.3": ">=1.4.0"
  "picomatch@<2.3.2": ">=2.3.2"
  "postcss": "^8.5.12"
  "undici@<6.24.0": "^6.24.0"
  "undici@>=7.0.0 <7.24.0": "^7.24.0"
  "uuid@<14.0.0": "^14.0.0"
  "ws@^8.0.0": "^8.20.1"
  "yaml@<2.8.3": ">=2.8.3"
  # expo-module-scripts resolves its expo peer to the latest SDK, whose metro 0.83
  # packages get hoisted to the root and break the example's expo 53 CLI, which
  # requires metro 0.82 internals through hoisting. Keep the whole tree on the
  # metro version the example's react-native 0.79 ships with.
  "metro-babel-transformer": "0.82.5"
  "metro-cache": "0.82.5"
  "metro-cache-key": "0.82.5"
  "metro-file-map": "0.82.5"
  "metro-minify-terser": "0.82.5"
  "metro-resolver": "0.82.5"
  "metro-symbolicate": "0.82.5"
  "metro-transform-plugins": "0.82.5"
  "metro-transform-worker": "0.82.5"
nodeLinker: hoisted
