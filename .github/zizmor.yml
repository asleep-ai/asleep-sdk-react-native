# zizmor configuration, read by the "Workflow lint / security" job in ci.yml.
# https://docs.zizmor.sh/configuration/
rules:
  artipacked:
    ignore:
      # The release jobs run only on workflow_dispatch from maintainers. prepare,
      # release-github and cleanup push the release branch and tag with the
      # checkout's persisted GITHUB_TOKEN, and the only artifact uploaded is the
      # generated release-notes file, never the workspace or .git.
      - release.yml
