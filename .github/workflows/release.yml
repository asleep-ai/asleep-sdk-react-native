name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Semver bump (patch / minor / major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (skip npm publish and GitHub release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      branch: ${{ steps.bump.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Compute next version and push release branch
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          NEW=$(pnpm dlx semver "$CURRENT" -i ${{ inputs.version_type }})
          BRANCH="release/v$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW on $BRANCH"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          npm version "$NEW" --no-git-tag-version
          pnpm install --lockfile-only
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): v$NEW [skip ci]"
          git push origin "$BRANCH"

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  merge:
    name: Merge release PR to main
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open and merge release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.prepare.outputs.branch }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          if ! gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): v$VERSION" \
              --body "Automated release PR for v$VERSION."
          fi

          gh pr merge "$BRANCH" \
            --merge \
            --delete-branch \
            --subject "chore(release): v$VERSION"

  publish-npm:
    name: Publish to npm
    needs: [prepare, build, merge]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish with provenance
        run: npm publish --provenance --access public

  release-github:
    name: Create GitHub release
    needs: [prepare, build, merge]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag merge commit
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest

  cleanup:
    name: Cleanup release branch
    needs: [prepare, build, merge, publish-npm, release-github]
    # Runs after dry-run completes, or when any job in a real release fails.
    # On a successful real release the merge job already deleted the branch,
    # so the delete below is a no-op (|| true).
    if: ${{ always() && needs.prepare.outputs.branch != '' && (inputs.dry_run || failure()) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete release branch if it still exists
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
