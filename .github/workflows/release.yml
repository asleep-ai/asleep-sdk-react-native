name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Semver bump — or "none" to (re)publish the current version without a bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      dry_run:
        description: 'Dry run (skip npm publish and GitHub release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '24.18.0'

jobs:
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      branch: ${{ steps.bump.outputs.branch }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Compute next version and push release branch
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")

          # "none" republishes the current version from main without bumping —
          # used to resume a partially-failed release (e.g. npm publish failed
          # after the tag and GitHub release were already created) without
          # double-bumping. No release branch is created; build/publish read
          # `ref` and operate on main.
          if [ "${{ inputs.version_type }}" = "none" ]; then
            {
              echo "version=$CURRENT"
              echo "branch="
              echo "ref=main"
            } >> "$GITHUB_OUTPUT"
            echo "Publish-only mode: (re)publish current version v$CURRENT from main; no bump."
            exit 0
          fi

          NEW=$(pnpm dlx semver "$CURRENT" -i ${{ inputs.version_type }})
          BRANCH="release/v$NEW"
          {
            echo "version=$NEW"
            echo "branch=$BRANCH"
            echo "ref=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW on $BRANCH"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # -B (not -b) resets the branch if a previous failed run left a stale one
          git checkout -B "$BRANCH"
          npm version "$NEW" --no-git-tag-version
          pnpm install --lockfile-only
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): v$NEW [skip ci]"
          git push --force-with-lease origin "$BRANCH"

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  merge:
    name: Merge release PR to main
    # Waits on release-notes so the release branch (which release-notes checks
    # out) is not deleted by `gh pr merge --delete-branch` before notes finish.
    needs: [prepare, build, release-notes]
    if: ${{ !inputs.dry_run && inputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open and merge release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.prepare.outputs.branch }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          # `|| true` keeps this idempotent on retry: if a PR for the branch already
          # exists (open or closed), gh exits non-zero and we fall through to merge.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "Automated release PR for v$VERSION." \
            || true

          # `--squash` matches repo settings (merge commits are disabled).
          gh pr merge "$BRANCH" \
            --squash \
            --delete-branch \
            --subject "chore(release): v$VERSION"

  publish-npm:
    name: Publish to npm
    needs: [prepare, build, merge]
    # Runs after merge in a normal release, and in "none" mode where merge is
    # skipped (main already carries the version). !cancelled() lets this job
    # evaluate its condition even though the needed `merge` job was skipped.
    if: >-
      ${{ !cancelled() && !inputs.dry_run
      && needs.prepare.result == 'success'
      && needs.build.result == 'success'
      && (needs.merge.result == 'success'
      || (inputs.version_type == 'none' && needs.merge.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Node 24 bundles npm >= 11.5.1, which performs the OIDC token exchange
      # that backs npm Trusted Publishers — so no manual npm CLI upgrade is
      # needed (Node 22 shipped npm 10, which signed provenance but could not
      # exchange the OIDC token, leaving the publish unauthenticated).
      # The npm view guard makes re-runs safe: if the version is already on the
      # registry (e.g. a "none"-mode resume after a later step failed), skip.
      - name: Publish with provenance (idempotent)
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

  release-notes:
    name: Generate release notes
    needs: [prepare, build]
    if: ${{ inputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the release branch (which contains the version bump + all
          # post-tag commits). On dry runs the branch is still alive; on real
          # releases the branch has not yet been deleted because `merge` runs
          # in a different job graph branch.
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0

      - name: Generate AI release notes
        id: ai_notes
        uses: asleep-ai/actions/release-notes@release-notes/v1
        with:
          # current-tag: HEAD lets the action auto-derive previous-tag via
          # `git describe --tags HEAD^`.
          current-tag: HEAD
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          system-prompt: |
            Generate bilingual release notes for the Asleep React Native SDK.
            Output markdown only — no preamble, no trailing commentary.
            Structure: English block first, then Korean block, separated by a horizontal rule.
            English block — header '## English' followed by sections
            '### New Features', '### Improvements', '### Bug Fixes', '### Internal Changes'.
            Korean block — header '## 한국어' followed by sections
            '### 신규 기능', '### 개선', '### 버그 수정', '### 내부 변경'.
            Omit empty sections; do not invent content.
            Input is a numbered list of commits; each entry contains the PR subject
            on the first line and the PR description (rationale, compatibility notes,
            verification) on the following lines. Use the description — not just the
            subject — when summarising user impact, then rewrite as a user-facing
            bullet (not verbatim).
            Wrap code identifiers, UUIDs, paths, and numeric thresholds in backticks.
            Preserve issue and PR references (#NNN).
            Ignore `Co-Authored-By:` trailers and merge artefacts.
            The two blocks must describe the same changes — Korean is a translation of
            the English content, not independent notes.

      - name: Preview notes in job summary
        run: |
          {
            echo "## Generated release notes preview"
            echo
            cat "${{ steps.ai_notes.outputs.path }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ steps.ai_notes.outputs.path }}
          retention-days: 7

  release-github:
    name: Create GitHub release
    needs: [prepare, build, merge, release-notes]
    if: ${{ !inputs.dry_run && inputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download notes artifact
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Tag merge commit
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
          else
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release with AI notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it (and any manual edits) untouched."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --latest
          fi

  cleanup:
    name: Cleanup release branch
    needs: [prepare, build, merge, release-notes, publish-npm, release-github]
    # Runs after dry-run completes, or when any job in a real release fails.
    # On a successful real release the merge job already deleted the branch,
    # so the delete below is a no-op (|| true).
    if: ${{ always() && needs.prepare.outputs.branch != '' && (inputs.dry_run || failure()) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete release branch if it still exists
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
